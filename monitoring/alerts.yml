groups:
  - name: ai-node-health
    rules:
      - alert: PrometheusTargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus target {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} has not been scrapeable for two minutes."

      - alert: ServiceProbeFailed
        expr: probe_success == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service or network probe failed"
          description: "Blackbox probe {{ $labels.instance }} has failed for two minutes."

      - alert: RootFilesystemNearlyFull
        expr: 100 * (1 - node_filesystem_avail_bytes{mountpoint="/rootfs",fstype!~"tmpfs|overlay"} / node_filesystem_size_bytes{mountpoint="/rootfs",fstype!~"tmpfs|overlay"}) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem is over 85% full"
          description: "Free storage is low enough to threaten models, databases, or Docker updates."

      - alert: HostMemoryPressure
        expr: 100 * (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Host memory usage is over 90%"
          description: "Sustained memory pressure may trigger the OOM killer."

      - alert: NvidiaGpuHot
        expr: nvidia_gpu_temperature_celsius > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NVIDIA GPU temperature is high"
          description: "GPU {{ $labels.gpu }} has remained above 85 C for five minutes."

      - alert: NvidiaMetricsUnavailable
        expr: nvidia_gpu_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NVIDIA telemetry is unavailable"
          description: "nvidia-smi is failing inside the exporter container."

      - alert: BackupStale
        expr: time() - ai_node_backup_last_success_unixtime_seconds > 129600
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "No verified backup in 36 hours"
          description: "The scheduled backup is stale; inspect ai-node-backup.service and available storage."

      - alert: BackupMetricMissing
        expr: absent(ai_node_backup_last_success_unixtime_seconds)
        for: 26h
        labels:
          severity: warning
        annotations:
          summary: "Backup success metric is missing"
          description: "No backup success metric has been published for more than 26 hours."

      - alert: NvmeMediaErrors
        expr: ai_node_nvme_media_errors > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NVMe media errors detected"
          description: "The NVMe device reports media and data integrity errors; check smartctl and schedule a replacement."

      - alert: NvmeWearHigh
        expr: ai_node_nvme_percentage_used > 80
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "NVMe wear is over 80%"
          description: "The NVMe device has consumed over 80% of its rated endurance; plan for a replacement."

      - alert: NvmeCriticalWarning
        expr: ai_node_nvme_critical_warning != 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NVMe critical warning is set"
          description: "The NVMe device has set its critical warning flag; inspect smartctl -H immediately."

      - alert: OomKillsDetected
        expr: increase(node_vmstat_oom_kill[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "OOM killer terminated processes"
          description: "The kernel OOM killer has terminated processes in the last hour; review memory limits."

      - alert: SwapUsageHigh
        expr: 100 * (1 - node_memory_SwapFree_bytes / (node_memory_SwapTotal_bytes > 0)) > 75
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Swap usage is over 75%"
          description: "Sustained swap pressure hurts latency on a single-host stack; review container memory limits."

      - alert: RootInodesNearlyFull
        expr: 100 * (1 - node_filesystem_files_free{mountpoint="/rootfs",fstype!~"tmpfs|overlay"} / node_filesystem_files{mountpoint="/rootfs",fstype!~"tmpfs|overlay"}) > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Root filesystem inodes are over 85% used"
          description: "Inode exhaustion blocks new files even when space remains; prune Docker layers and logs."
