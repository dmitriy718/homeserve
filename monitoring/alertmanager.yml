# Alertmanager configuration for the ai-node stack.
#
# Notification path: Alertmanager -> ntfy (self-hosted, runs as the "ntfy"
# compose service on the ai-node network; compose wiring happens separately).
#
# How the ntfy webhook works:
#   ntfy's publish endpoint accepts a plain POST to /<topic> and delivers the
#   raw request body as the notification message. Alertmanager's webhook
#   receiver POSTs its JSON alert payload as the body, so pointing
#   webhook_configs at http://ntfy:80/<topic> just works: subscribers see the
#   alert JSON. No transformer sidecar is required. If prettier messages are
#   wanted later, front ntfy with a small transformer or switch to ntfy's
#   templated publishing.
#
# Subscribing: ntfy app or `curl -N http://<host>/homeserve-alerts/json`
# (topic "homeserve-alerts"; critical alerts also go to
# "homeserve-alerts-critical" so they can be subscribed with max priority).
#
# Because Alertmanager cannot set per-request ntfy headers (priority, title,
# tags) through webhook_configs, severity fan-out is done with separate
# topics instead of ntfy priorities.

global:
  resolve_timeout: 5m

route:
  receiver: ntfy
  group_by: [alertname, severity]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity = "critical"
      receiver: ntfy-critical
      repeat_interval: 1h
    - matchers:
        - severity = "warning"
      receiver: ntfy
      repeat_interval: 12h

receivers:
  - name: ntfy
    webhook_configs:
      - url: http://ntfy:80/homeserve-alerts
        send_resolved: true
  - name: ntfy-critical
    webhook_configs:
      - url: http://ntfy:80/homeserve-alerts-critical
        send_resolved: true

  # Alternative receivers (uncomment and fill in to use instead of / besides ntfy):
  #
  # - name: email
  #   email_configs:
  #     - to: ops@example.com
  #       from: alertmanager@example.com
  #       smarthost: smtp.example.com:587
  #       auth_username: alertmanager@example.com
  #       auth_password_file: /etc/alertmanager/secrets/smtp-password
  #       send_resolved: true
  #
  # - name: telegram
  #   telegram_configs:
  #     - bot_token_file: /etc/alertmanager/secrets/telegram-bot-token
  #       chat_id: 123456789
  #       parse_mode: HTML
  #       send_resolved: true

inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
    equal: [alertname]
