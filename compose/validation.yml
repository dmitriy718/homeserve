services:
  agent-gateway:
    env_file: !reset []
    environment:
      # Blank the file-based key so app.py exercises its env-var fallback here.
      AGENT_GATEWAY_KEY_FILE: ""
      AGENT_GATEWAY_KEY: validation-only-key-000000000000000000000000
  grafana:
    env_file: !reset []
    environment:
      GF_SECURITY_ADMIN_USER: validation
      GF_SECURITY_ADMIN_PASSWORD: validation-only-password
  speedtest-tracker:
    env_file: !reset []
    environment:
      APP_KEY: base64:dmFsaWRhdGlvbi1vbmx5LWtleS0wMDAwMDAwMA==
  lldap:
    env_file: !reset []

# The real key/secret files are git-ignored and absent in CI; point each
# Docker secret at its committed placeholder so `docker compose config`
# resolves. The gateway still gets its key from AGENT_GATEWAY_KEY above
# (app.py env fallback); the Authelia *_FILE paths point into /run/secrets,
# so the placeholder contents are never exercised by config validation.
secrets:
  agent_gateway_key:
    file: ../secrets/agent-gateway.key.example
  authelia_session_secret:
    file: ../secrets/authelia-session.secret.example
  authelia_storage_secret:
    file: ../secrets/authelia-storage.secret.example
  authelia_ldap_bind_password:
    file: ../secrets/authelia-ldap-bind.secret.example
