name: ai-node

x-common: &common
  restart: unless-stopped
  init: true
  pids_limit: 1024
  stop_grace_period: 45s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  ollama:
    <<: *common
    image: ollama/ollama:0.32.6
    container_name: ai-ollama
    # App manifest labels — see docs/APP_MANIFEST.md. Everything downstream
    # (probes, dashboard tiles, health checks, backup pauses) derives from these.
    labels:
      homeserv.name: "Ollama"
      homeserv.purpose: "LLM inference API"
      homeserv.legacy.port: "11434"
      homeserv.probe.url: "http://ollama:11434/api/tags"
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - /srv/models/ollama:/root/.ollama
    # Legacy direct access; the Caddy proxy is the front door for UIs.
    ports:
      - "${LAN_IP}:11434:11434"
      - "${TAILSCALE_IP}:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 8g
    networks: [ai, scrape]

  agent-gateway:
    <<: *common
    build:
      context: ../services/agent-gateway
    image: local/ai-node-agent-gateway:1.1
    container_name: ai-agent-gateway
    labels:
      homeserv.name: "Agent Gateway"
      homeserv.purpose: "Scoped tool API for agent jobs"
      homeserv.subdomain: "gateway"
      homeserv.legacy.port: "8090"
      homeserv.probe.url: "http://agent-gateway:8090/health"
      homeserv.backup.pause: "true"
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    environment:
      WORKSPACE_ROOT: /srv/agent-workspaces
      ARTIFACT_ROOT: /srv/agent-artifacts
      AGENT_GATEWAY_KEY_FILE: /run/secrets/agent_gateway_key
    secrets:
      - agent_gateway_key
    volumes:
      - /srv/ai-node/agent-platform/workspaces:/srv/agent-workspaces
      - /srv/ai-node/agent-platform/artifacts:/srv/agent-artifacts
      - /srv/ai-node/agent-platform/cache:/srv/agent-cache
    # Legacy direct access; the Caddy proxy is the front door for UIs.
    ports:
      - "${LAN_IP}:8090:8090"
      - "${TAILSCALE_IP}:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\x27http://127.0.0.1:8090/health\x27, timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 512m
    cpus: 2
    networks: [ai, scrape]

  open-webui:
    <<: *common
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: ai-open-webui
    labels:
      homeserv.name: "Open WebUI"
      homeserv.purpose: "Chat UI for local models"
      homeserv.subdomain: "webui"
      homeserv.probe.url: "http://open-webui:8080/health"
      homeserv.backup.pause: "true"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      # Auth OFF by default (trusted LAN): anyone on the network gets full
      # admin access, no login. To enable login: set WEBUI_AUTH "True",
      # uncomment the trusted-header lines below, and flip the Authelia ACLs
      # in config/authelia/configuration.yml (its header documents all three
      # steps). With trusted headers on, the first SSO user becomes admin.
      WEBUI_AUTH: "False"
      ENABLE_SIGNUP: "False"
      # WEBUI_AUTH_TRUSTED_EMAIL_HEADER: "Remote-Email"
      # WEBUI_AUTH_TRUSTED_NAME_HEADER: "Remote-Name"
      ENABLE_OPENAI_API: "False"
      ENABLE_OLLAMA_API: "True"
      DEFAULT_MODEL_PARAMS: "{\"function_calling\":\"native\"}"
      WEBUI_NAME: homeserv AI
    volumes:
      - /srv/ai-node/data/open-webui:/app/backend/data
      - /srv/ai-node/agent-platform/workspaces:/srv/agent-workspaces
    # Proxy-only by design: if trusted-header auth is ever enabled (see the
    # commented lines below), any direct port would become an impersonation
    # path via forged Remote-* headers. One front door, no exceptions.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 2g
    networks: [ai, scrape]

  embeddings:
    <<: *common
    build:
      context: ../services/embedding
    image: local/ai-node-embeddings:1.1
    container_name: ai-embeddings
    labels:
      homeserv.name: "Embeddings"
      homeserv.purpose: "OpenAI-compatible embeddings API"
      homeserv.legacy.port: "8081"
      homeserv.probe.url: "http://embeddings:8080/health"
    environment:
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      MODEL_CACHE: /models
      OMP_NUM_THREADS: "4"
      MAX_EMBEDDING_INPUTS: "64"
      MAX_EMBEDDING_CHARS: "50000"
    volumes:
      - /srv/models/embeddings:/models
    # Legacy direct access; the Caddy proxy is the front door for UIs.
    ports:
      - "${LAN_IP}:8081:8080"
      - "${TAILSCALE_IP}:8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    cpus: 4
    mem_limit: 2g
    networks: [ai, scrape]

  comfyui:
    <<: *common
    build:
      context: ../services/comfyui
      args:
        COMFYUI_TAG: v0.31.0
    image: local/ai-node-comfyui:0.31.0
    container_name: ai-comfyui
    labels:
      homeserv.name: "ComfyUI"
      homeserv.purpose: "Image generation workflows"
      homeserv.subdomain: "comfy"
      homeserv.legacy.port: "8188"
      homeserv.probe.url: "http://comfyui:8188/system_stats"
      homeserv.backup.pause: "true"
    gpus: all
    environment:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - /srv/models/comfyui:/opt/ComfyUI/models
      - /srv/ai-node/data/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes
      - /srv/ai-node/data/comfyui/input:/opt/ComfyUI/input
      - /srv/ai-node/data/comfyui/output:/opt/ComfyUI/output
      - /srv/ai-node/data/comfyui/user:/opt/ComfyUI/user
    # Legacy direct access; the Caddy proxy is the front door for UIs.
    ports:
      - "${LAN_IP}:8188:8188"
      - "${TAILSCALE_IP}:8188:8188"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    mem_limit: 8g
    networks: [ai, scrape]

  gpu-scheduler:
    <<: *common
    build:
      context: ../services/gpu-scheduler
    image: local/ai-node-gpu-scheduler:1.0
    container_name: ai-gpu-scheduler
    labels:
      homeserv.name: "GPU Scheduler"
      homeserv.purpose: "Cooperative GPU lease arbiter (see docs/GPU_SCHEDULING.md)"
      homeserv.probe.url: "http://gpu-scheduler:8077/state"
      # No homeserv.subdomain / legacy.port / backup.pause: an internal
      # coordinator, not a browser-facing app and safe to back up live
      # (state is in-memory by design).
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777
    # Localhost-only publish, unlike the other services: scripts/gpu-lock.sh
    # and other host-side tooling need the API, but the LAN (and Tailscale)
    # has no business talking to the lease arbiter.
    ports:
      - "127.0.0.1:8077:8077"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8077/state', timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 256m
    networks: [ai, scrape]

  prometheus:
    <<: *common
    image: prom/prometheus:v3.13.2
    container_name: monitor-prometheus
    labels:
      homeserv.name: "Prometheus"
      homeserv.purpose: "Metrics and alert evaluation"
      homeserv.subdomain: "prom"
      homeserv.legacy.port: "9091"
      homeserv.probe.url: "http://prometheus:9090/-/healthy"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      # No --web.enable-lifecycle: reload config with a container restart.
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Label-discovered blackbox probe targets written by
      # scripts/discover-services.sh (file_sd; see docs/APP_MANIFEST.md).
      - ../monitoring/targets.d:/etc/prometheus/targets.d:ro
      - /srv/ai-node/data/prometheus:/prometheus
    # Legacy direct access; the Caddy proxy is the front door for UIs.
    ports:
      - "${LAN_IP}:9091:9090"
      - "${TAILSCALE_IP}:9091:9090"
    healthcheck:
      test: ["CMD", "/bin/promtool", "check", "ready", "--url=http://127.0.0.1:9090"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 1g
    networks: [monitoring, scrape]

  alertmanager:
    <<: *common
    image: prom/alertmanager:v0.29.0
    container_name: monitor-alertmanager
    labels:
      homeserv.name: "Alertmanager"
      homeserv.purpose: "Alert routing and notification dispatch"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - /srv/ai-node/data/alertmanager:/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 128m
    networks: [monitoring]

  ntfy:
    <<: *common
    image: binwiederhier/ntfy:v2.14.0
    container_name: monitor-ntfy
    labels:
      homeserv.name: "ntfy"
      homeserv.purpose: "Alert notifications to your phone"
      homeserv.subdomain: "ntfy"
      homeserv.legacy.port: "2586"
      # No homeserv.probe.url: not attached to the scrape network, so the
      # blackbox exporter cannot reach it (probed via its legacy port instead).
    command: serve
    environment:
      NTFY_BASE_URL: https://ntfy.${BASE_DOMAIN:-homeserve.lan}
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/cache/ntfy/cache.db
      NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
    volumes:
      - /srv/ai-node/data/ntfy:/var/cache/ntfy
    # Published so phones/desktops can subscribe with the ntfy app directly.
    ports:
      - "${LAN_IP}:2586:80"
      - "${TAILSCALE_IP}:2586:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    networks: [monitoring]

  grafana:
    <<: *common
    image: grafana/grafana:13.1.3
    container_name: monitor-grafana
    labels:
      homeserv.name: "Grafana"
      homeserv.purpose: "Metrics dashboards"
      homeserv.subdomain: "grafana"
      homeserv.probe.url: "http://grafana:3000/api/health"
      homeserv.backup.pause: "true"
    depends_on:
      prometheus:
        condition: service_healthy
    env_file:
      - ../secrets/grafana.env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Auth OFF by default (trusted LAN): anonymous access with Admin role,
      # no login. To enable login: comment the two anonymous lines, uncomment
      # the GF_AUTH_PROXY_* block (SSO header trust; autoprovisioned users
      # start as Viewer), and flip the Authelia ACLs in
      # config/authelia/configuration.yml. The classic login form stays as
      # break-glass access either way (secrets/grafana.env).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      # GF_AUTH_PROXY_ENABLED: "true"
      # GF_AUTH_PROXY_HEADER_NAME: "Remote-Email"
      # GF_AUTH_PROXY_HEADERS: "Email:Remote-Email Name:Remote-Name"
      # GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
    volumes:
      - /srv/ai-node/data/grafana:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
    # Proxy-only by design: if auth-proxy header trust is ever enabled (see
    # the commented GF_AUTH_PROXY_* block), any direct port would become an
    # impersonation path via forged Remote-* headers. One front door.
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    networks: [monitoring, scrape]

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.12.1
    container_name: monitor-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
      - --collector.textfile.directory=/textfile
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
      - /srv/ai-node/data/node-exporter-textfile:/textfile:ro
    mem_limit: 128m
    networks: [scrape]

  blackbox-exporter:
    <<: *common
    image: prom/blackbox-exporter:v0.28.0
    container_name: monitor-blackbox
    cap_add: [NET_RAW]
    volumes:
      - ../monitoring/blackbox.yml:/config/blackbox.yml:ro
    command: ["--config.file=/config/blackbox.yml"]
    mem_limit: 128m
    networks: [scrape]

  nvidia-exporter:
    <<: *common
    build:
      context: ../services/nvidia-exporter
    image: local/ai-node-nvidia-exporter:1.1
    container_name: monitor-nvidia-exporter
    gpus: all
    cap_drop: [ALL]
    read_only: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9400/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 128m
    networks: [scrape]

  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:2.5.0
    container_name: monitor-uptime-kuma
    labels:
      homeserv.name: "Uptime Kuma"
      homeserv.purpose: "Uptime monitoring and status pages"
      homeserv.subdomain: "kuma"
      homeserv.legacy.port: "3002"
      homeserv.probe.url: "http://uptime-kuma:3001/"
      homeserv.backup.pause: "true"
    environment:
      # Auth OFF by default (trusted LAN): no login, full access. Remove this
      # line (and flip the Authelia ACLs) to require Kuma's own account.
      UPTIME_KUMA_DISABLE_AUTH: "1"
    volumes:
      - /srv/ai-node/data/uptime-kuma:/app/data
    # Legacy direct access; the Caddy proxy is the front door for UIs.
    ports:
      - "${LAN_IP}:3002:3001"
      - "${TAILSCALE_IP}:3002:3001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:3001/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    networks: [monitoring, scrape]

  speedtest-tracker:
    <<: *common
    image: lscr.io/linuxserver/speedtest-tracker:1.14.7
    container_name: monitor-speedtest
    labels:
      homeserv.name: "Speedtest"
      homeserv.purpose: "Daily Internet speed history"
      homeserv.legacy.port: "8765"
      homeserv.probe.url: "http://speedtest-tracker/"
      homeserv.backup.pause: "true"
    # LinuxServer's s6-overlay must remain PID 1.
    init: false
    env_file:
      - ../secrets/speedtest.env
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: "0 6 * * *"
      PRUNE_RESULTS_OLDER_THAN: "365"
      DISPLAY_TIMEZONE: ${TZ}
    volumes:
      - /srv/ai-node/data/speedtest:/config
    # Legacy direct access; the Caddy proxy is the front door for UIs.
    ports:
      - "${LAN_IP}:8765:80"
      - "${TAILSCALE_IP}:8765:80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    mem_limit: 1g
    networks: [monitoring, scrape]

  # --- Single sign-on -------------------------------------------------------
  # LLDAP is the user backend, Authelia the login portal. Neither publishes a
  # port: browsers reach them only through Caddy (auth./lldap. subdomains),
  # and Caddy's forward_auth checks every protected UI against Authelia.

  lldap:
    <<: *common
    image: lldap/lldap:v0.6.3-alpine
    container_name: auth-lldap
    labels:
      homeserv.name: "LLDAP"
      homeserv.purpose: "LDAP user backend for single sign-on"
      # No homeserv.subdomain: the lldap. site exists in Caddy, but this is an
      # admin backend and deliberately gets no dashboard tile.
    env_file:
      - ../secrets/lldap.env
    environment:
      # Literal DN matching BASE_DOMAIN; keep in sync with base_dn in
      # config/authelia/configuration.yml if BASE_DOMAIN ever changes.
      LLDAP_LDAP_BASE_DN: dc=homeserve,dc=lan
      # Base URL used in password-reset links.
      LLDAP_HTTP_URL: https://lldap.${BASE_DOMAIN:-homeserve.lan}
    volumes:
      - /srv/ai-node/data/lldap:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:17170/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 256m
    networks: [monitoring, scrape]

  authelia:
    <<: *common
    image: authelia/authelia:4.39.20
    container_name: auth-authelia
    labels:
      homeserv.name: "Authelia SSO"
      homeserv.purpose: "Sign-on portal — the protected services below redirect here before letting you in"
      homeserv.subdomain: "auth"
      # No legacy port and no probe: reachable only through Caddy.
    depends_on:
      lldap:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      # Secret values come from the Docker secrets below; the keys themselves
      # stay out of config/authelia/configuration.yml.
      AUTHELIA_SESSION_SECRET_FILE: /run/secrets/authelia_session_secret
      AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE: /run/secrets/authelia_storage_secret
      AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE: /run/secrets/authelia_ldap_bind_password
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE: /run/secrets/authelia_jwt_secret
    secrets:
      - authelia_session_secret
      - authelia_storage_secret
      - authelia_ldap_bind_password
      - authelia_jwt_secret
    volumes:
      - ../config/authelia/configuration.yml:/config/configuration.yml:ro
      - /srv/ai-node/data/authelia:/config
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9091/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 256m
    networks: [monitoring, scrape]

  caddy:
    <<: *common
    image: caddy:2.10.2-alpine
    container_name: edge-caddy
    labels:
      homeserv.name: "Caddy"
      homeserv.purpose: "Reverse proxy, TLS, and SSO front door"
      # No subdomain/port/probe labels: infra, no dashboard tile.
    environment:
      BASE_DOMAIN: ${BASE_DOMAIN:-homeserve.lan}
    volumes:
      - ../config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ../services/dashboard:/srv:ro
      - /srv/ai-node/data/caddy/data:/data
      - /srv/ai-node/data/caddy/config:/config
    ports:
      # 443 only: a system httpd (preserved non-compose workload) owns *:80
      # on this host, so the HTTP->HTTPS redirect is unavailable; use
      # https://<sub>.{BASE_DOMAIN} directly.
      - "${LAN_IP}:443:443"
      - "${TAILSCALE_IP}:443:443"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    mem_limit: 128m
    networks: [ai, monitoring]

  playwright:
    build:
      context: ../services/playwright
    image: local/ai-node-playwright:1.62.1
    container_name: dev-playwright-test
    profiles: [dev]
    init: true
    shm_size: 1gb
    security_opt:
      - seccomp=../services/playwright/seccomp_profile.json
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 2g
    networks: [dev]

networks:
  ai:
    name: ai-node-ai
  monitoring:
    name: ai-node-monitoring
  # Prometheus-only path to exporters and blackbox-probed services, so the
  # data plane (ai) and the monitoring UI plane stay off each other.
  scrape:
    name: ai-node-scrape
  dev:
    name: ai-node-dev

secrets:
  agent_gateway_key:
    file: ../secrets/agent-gateway.key
  # Authelia session cookie secret (AUTHELIA_SESSION_SECRET_FILE).
  authelia_session_secret:
    file: ../secrets/authelia-session.secret
  # Authelia storage encryption key (AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE).
  authelia_storage_secret:
    file: ../secrets/authelia-storage.secret
  # LDAP bind password for Authelia; must equal LLDAP_LDAP_USER_PASS in
  # secrets/lldap.env (bootstrap-secrets.sh keeps them in sync).
  authelia_ldap_bind_password:
    file: ../secrets/authelia-ldap-bind.secret
  # Password-reset JWT secret (AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE);
  # required by Authelia 4.39 at startup even with the filesystem notifier.
  authelia_jwt_secret:
    file: ../secrets/authelia-jwt.secret
