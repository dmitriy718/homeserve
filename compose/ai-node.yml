name: ai-node

x-common: &common
  restart: unless-stopped
  init: true
  pids_limit: 1024
  stop_grace_period: 45s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  ollama:
    <<: *common
    image: ollama/ollama:0.32.6
    container_name: ai-ollama
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_FLASH_ATTENTION: "1"
    volumes:
      - /srv/models/ollama:/root/.ollama
    ports:
      - "${LAN_IP}:11434:11434"
      - "${TAILSCALE_IP}:11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    mem_limit: 8g
    networks: [ai, monitoring]

  agent-gateway:
    <<: *common
    build:
      context: ../services/agent-gateway
    image: local/ai-node-agent-gateway:1.0
    container_name: ai-agent-gateway
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,mode=1777
    env_file:
      - ../secrets/agent-gateway.env
    environment:
      WORKSPACE_ROOT: /srv/agent-workspaces
      ARTIFACT_ROOT: /srv/agent-artifacts
    volumes:
      - /srv/ai-node/agent-platform/workspaces:/srv/agent-workspaces
      - /srv/ai-node/agent-platform/artifacts:/srv/agent-artifacts
      - /srv/ai-node/agent-platform/cache:/srv/agent-cache
    ports:
      - "${LAN_IP}:8090:8090"
      - "${TAILSCALE_IP}:8090:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen(\x27http://127.0.0.1:8090/health\x27, timeout=3)"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 512m
    cpus: 2
    networks: [ai, monitoring, dev]

  open-webui:
    <<: *common
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: ai-open-webui
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WEBUI_AUTH: "False"
      ENABLE_SIGNUP: "False"
      ENABLE_OPENAI_API: "False"
      ENABLE_OLLAMA_API: "True"
      DEFAULT_MODEL_PARAMS: "{\"function_calling\":\"native\"}"
      WEBUI_NAME: homeserv AI
    volumes:
      - /srv/ai-node/data/open-webui:/app/backend/data
      - /srv/ai-node/agent-platform/workspaces:/srv/agent-workspaces
    ports:
      - "${LAN_IP}:3000:8080"
      - "${TAILSCALE_IP}:3000:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    mem_limit: 2g
    networks: [ai, monitoring]

  embeddings:
    <<: *common
    build:
      context: ../services/embedding
    image: local/ai-node-embeddings:1.0
    container_name: ai-embeddings
    environment:
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      MODEL_CACHE: /models
      OMP_NUM_THREADS: "4"
      MAX_EMBEDDING_INPUTS: "64"
      MAX_EMBEDDING_CHARS: "50000"
    volumes:
      - /srv/models/embeddings:/models
    ports:
      - "${LAN_IP}:8081:8080"
      - "${TAILSCALE_IP}:8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    cpus: 4
    mem_limit: 2g
    networks: [ai, monitoring]

  comfyui:
    <<: *common
    build:
      context: ../services/comfyui
      args:
        COMFYUI_TAG: v0.31.0
    image: local/ai-node-comfyui:0.31.0
    container_name: ai-comfyui
    gpus: all
    environment:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    volumes:
      - /srv/models/comfyui:/opt/ComfyUI/models
      - /srv/ai-node/data/comfyui/custom_nodes:/opt/ComfyUI/custom_nodes
      - /srv/ai-node/data/comfyui/input:/opt/ComfyUI/input
      - /srv/ai-node/data/comfyui/output:/opt/ComfyUI/output
      - /srv/ai-node/data/comfyui/user:/opt/ComfyUI/user
    ports:
      - "${LAN_IP}:8188:8188"
      - "${TAILSCALE_IP}:8188:8188"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    mem_limit: 8g
    networks: [ai, monitoring]

  prometheus:
    <<: *common
    image: prom/prometheus:v3.13.2
    container_name: monitor-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - /srv/ai-node/data/prometheus:/prometheus
    ports:
      - "${LAN_IP}:9091:9090"
      - "${TAILSCALE_IP}:9091:9090"
    mem_limit: 1g
    networks: [monitoring]

  grafana:
    <<: *common
    image: grafana/grafana:13.1.3
    container_name: monitor-grafana
    depends_on: [prometheus]
    env_file:
      - ../secrets/grafana.env
    environment:
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - /srv/ai-node/data/grafana:/var/lib/grafana
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
    ports:
      - "${LAN_IP}:3001:3000"
      - "${TAILSCALE_IP}:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    networks: [monitoring]

  node-exporter:
    <<: *common
    image: prom/node-exporter:v1.12.1
    container_name: monitor-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    mem_limit: 128m
    networks: [monitoring]

  blackbox-exporter:
    <<: *common
    image: prom/blackbox-exporter:v0.28.0
    container_name: monitor-blackbox
    cap_add: [NET_RAW]
    volumes:
      - ../monitoring/blackbox.yml:/config/blackbox.yml:ro
    command: ["--config.file=/config/blackbox.yml"]
    mem_limit: 128m
    networks: [monitoring]

  nvidia-exporter:
    <<: *common
    build:
      context: ../services/nvidia-exporter
    image: local/ai-node-nvidia-exporter:1.0
    container_name: monitor-nvidia-exporter
    gpus: all
    cap_drop: [ALL]
    read_only: true
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9400/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
    mem_limit: 128m
    networks: [monitoring]

  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:2.5.0
    container_name: monitor-uptime-kuma
    volumes:
      - /srv/ai-node/data/uptime-kuma:/app/data
    ports:
      - "${LAN_IP}:3002:3001"
      - "${TAILSCALE_IP}:3002:3001"
    mem_limit: 512m
    networks: [monitoring]

  speedtest-tracker:
    <<: *common
    image: lscr.io/linuxserver/speedtest-tracker:1.14.7
    container_name: monitor-speedtest
    # LinuxServer's s6-overlay must remain PID 1.
    init: false
    env_file:
      - ../secrets/speedtest.env
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      DB_CONNECTION: sqlite
      SPEEDTEST_SCHEDULE: "0 6 * * *"
      PRUNE_RESULTS_OLDER_THAN: "365"
      DISPLAY_TIMEZONE: ${TZ}
    volumes:
      - /srv/ai-node/data/speedtest:/config
    ports:
      - "${LAN_IP}:8765:80"
      - "${TAILSCALE_IP}:8765:80"
    mem_limit: 1g
    networks: [monitoring]

  playwright:
    build:
      context: ../services/playwright
    image: local/ai-node-playwright:1.62.1
    container_name: dev-playwright-test
    profiles: [dev]
    init: true
    ipc: host
    security_opt:
      - seccomp=../services/playwright/seccomp_profile.json
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 2g
    networks: [dev]

networks:
  ai:
    name: ai-node-ai
  monitoring:
    name: ai-node-monitoring
  dev:
    name: ai-node-dev
