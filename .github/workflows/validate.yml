name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Bash syntax and ShellCheck
        run: |
          bash -n scripts/*.sh agent-platform/scripts/*
          shellcheck scripts/*.sh agent-platform/scripts/*

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python syntax
        run: python3 -m py_compile $(find services -name '*.py' -print)

      - name: Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose --env-file .env -f compose/ai-node.yml -f compose/validation.yml config -q

      - name: Install Python test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/agent-gateway/requirements.txt
          # CPU-only torch first, matching services/embedding/Dockerfile.
          pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.0+cpu"
          pip install "sentence-transformers==5.7.0" "fastapi==0.141.1" "uvicorn[standard]==0.52.1"

      - name: Run unit tests
        env:
          # app.py requires a gateway key of at least 32 characters at import.
          AGENT_GATEWAY_KEY: ci-validation-key-000000000000000000000000
          WORKSPACE_ROOT: /tmp/ci-agent-workspaces
          ARTIFACT_ROOT: /tmp/ci-agent-artifacts
        run: |
          cd services/agent-gateway && python -m unittest -v test_app.py
          cd ../embedding && python -m unittest -v test_app.py
          cd ../nvidia-exporter && python -m unittest -v test_exporter.py
