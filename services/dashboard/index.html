<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>homeserve</title>
<style>
  :root {
    --bg: #0a0c10;
    --panel: rgba(255, 255, 255, 0.032);
    --panel-hover: rgba(255, 255, 255, 0.055);
    --border: rgba(255, 255, 255, 0.075);
    --text: #e8eaf0;
    --muted: #8a92a3;
    --faint: #5b6272;
    --up: #34d399;
    --down: #f87171;
    --checking: #6e7681;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1100px 500px at 85% -10%, rgba(99, 102, 241, 0.14), transparent 60%),
      radial-gradient(900px 450px at -10% 0%, rgba(56, 189, 248, 0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 1180px; margin: 0 auto; padding: 2.75rem 1.5rem 4rem; }

  /* ---- header -------------------------------------------------------- */
  header.top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
    margin-bottom: 2.5rem;
  }
  .brand { display: flex; align-items: center; gap: 0.9rem; }
  .brand .mark {
    width: 44px; height: 44px; flex: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6);
    display: grid; place-items: center;
    box-shadow: 0 4px 18px rgba(99, 102, 241, 0.35);
  }
  .brand .mark svg { width: 24px; height: 24px; color: #fff; }
  .brand h1 { font-size: 1.45rem; margin: 0; font-weight: 700; letter-spacing: -0.02em; }
  .brand p { margin: 0; color: var(--muted); font-size: 0.85rem; }

  .pill {
    display: inline-flex; align-items: center; gap: 0.55rem;
    padding: 0.5rem 0.95rem;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--panel);
    font-size: 0.85rem;
    color: var(--muted);
    white-space: nowrap;
  }
  .pill .dot { width: 0.55rem; height: 0.55rem; }
  .pill.ok { color: var(--up); border-color: rgba(52, 211, 153, 0.35); }
  .pill.ok .dot { background: var(--up); box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); }
  .pill.bad { color: var(--down); border-color: rgba(248, 113, 113, 0.35); }
  .pill.bad .dot { background: var(--down); box-shadow: 0 0 8px rgba(248, 113, 113, 0.8); }

  /* ---- sections ------------------------------------------------------- */
  section.group { margin-bottom: 2.1rem; }
  section.group > h2 {
    font-size: 0.78rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    color: var(--faint);
    margin: 0 0 0.85rem 0.15rem;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
    gap: 0.9rem;
  }

  /* ---- tiles ----------------------------------------------------------- */
  .tile {
    position: relative;
    display: flex; flex-direction: column; gap: 0.7rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1.05rem 1.15rem;
    text-decoration: none;
    color: inherit;
    transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease;
  }
  a.tile:hover {
    transform: translateY(-2px);
    background: var(--panel-hover);
    border-color: color-mix(in srgb, var(--hue) 45%, transparent);
  }
  .tile .head { display: flex; align-items: center; gap: 0.8rem; }
  .chip {
    width: 38px; height: 38px; flex: none;
    border-radius: 10px;
    display: grid; place-items: center;
    background: color-mix(in srgb, var(--hue) 15%, transparent);
    color: var(--hue);
  }
  .chip svg { width: 20px; height: 20px; }
  .tile .name { font-weight: 650; font-size: 0.98rem; letter-spacing: -0.01em; }
  .tile .status {
    display: flex; align-items: center; gap: 0.45rem;
    font-size: 0.8rem; color: var(--muted);
    font-variant-numeric: tabular-nums;
    min-height: 1.2em;
  }
  .tile .status.up { color: var(--up); }
  .tile .status.down { color: var(--down); }
  .tile .purpose { color: var(--muted); font-size: 0.84rem; margin: 0; flex: 1; }
  .tile .open {
    position: absolute; top: 0.95rem; right: 1rem;
    color: var(--faint);
    opacity: 0; transition: opacity 0.16s ease;
  }
  a.tile:hover .open { opacity: 1; }
  .open svg { width: 15px; height: 15px; display: block; }

  .dot {
    width: 0.5rem; height: 0.5rem; border-radius: 50%;
    background: var(--checking);
    flex: none;
  }
  .dot.up { background: var(--up); box-shadow: 0 0 7px rgba(52, 211, 153, 0.9); }
  .dot.down { background: var(--down); box-shadow: 0 0 7px rgba(248, 113, 113, 0.9); }
  .dot.checking { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) {
    .dot.checking { animation: none; }
    .tile { transition: none; }
  }

  /* ---- footer ----------------------------------------------------------- */
  footer {
    margin-top: 2.75rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    color: var(--faint);
    font-size: 0.8rem;
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    flex-wrap: wrap;
  }
  footer .meta { font-variant-numeric: tabular-nums; }
  code {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 4px; padding: 0.1em 0.35em; font-size: 0.9em;
  }
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="m3 10 9-7 9 7"/><path d="M5 8.5V21h14V8.5"/><path d="M9 21v-5h6v5"/>
        </svg>
      </div>
      <div>
        <h1>homeserve</h1>
        <p>Home server dashboard</p>
      </div>
    </div>
    <div class="pill" id="overall"><span class="dot checking"></span><span id="overall-text">Checking services…</span></div>
  </header>

  <div id="groups"></div>

  <noscript>
    <p>Enable JavaScript for live status. Services run as subdomains of
       homeserve.lan — webui, comfy, grafana, kuma, prom, ntfy, jellyfin,
       immich, cloud — see SERVICE_MAP.md.</p>
  </noscript>

  <footer>
    <span>Docs in the repo at <code>/srv/ai-node</code> — <code>docs/QUICKSTART.md</code>, <code>SERVICE_MAP.md</code>, <code>README.md</code></span>
    <span class="meta" id="refreshed"></span>
  </footer>
</main>

<script>
"use strict";

// Base domain for building links (e.g. webui.homeserve.lan). Derived from
// the hostname this page was loaded from so it works under any BASE_DOMAIN;
// falls back when opened from a bare IP or localhost.
function baseDomain() {
  const parts = window.location.hostname.split(".");
  if (parts.length >= 2 && !/^\d+$/.test(parts[parts.length - 1])) {
    return parts.slice(-2).join(".");
  }
  return "homeserve.lan";
}
const BASE = baseDomain();

// Stroke icons (24x24). Kept inline so the page makes zero external requests.
const ICONS = {
  chat:    '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  image:   '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/>',
  play:    '<circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4V8z"/>',
  photos:  '<rect x="8" y="8" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  cloud:   '<path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/>',
  gauge:   '<path d="m12 14 4-4"/><path d="M3.34 19a10 10 0 1 1 17.32 0"/>',
  cpu:     '<rect x="5" y="5" width="14" height="14" rx="2"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/>',
  box:     '<path d="M21 8 12 3 3 8v8l9 5 9-5V8z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/>',
  pulse:   '<path d="M2 12h4l2-7 4 14 2-7h8"/>',
  chart:   '<path d="M3 3v18h18"/><path d="m7 15 4-6 4 3 5-8"/>',
  flame:   '<path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.07-2.14-.22-4.05 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.15.43-2.29 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>',
  bell:    '<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  shield:  '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>',
  users:   '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  zap:     '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
  arrow:   '<path d="M7 17 17 7"/><path d="M7 7h10v10"/>'
};
function icon(name) {
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]}</svg>`;
}

// The service catalog. `probe` keys map to the same-origin /healthz/<key>
// routes Caddy serves on this very site (see config/caddy/Caddyfile) — so
// every dot is a real HTTPS probe to a real health endpoint, with no extra
// DNS names and no mixed-content fetches.
const GROUPS = [
  { title: "Apps", services: [
    { name: "Open WebUI",   purpose: "Chat UI for local models",         sub: "webui",    probe: "webui",     icon: "chat",   hue: "#60a5fa" },
    { name: "ComfyUI",      purpose: "Image generation workflows",       sub: "comfy",    probe: "comfy",     icon: "image",  hue: "#c084fc" },
    { name: "Jellyfin",     purpose: "Movies, shows and music",          sub: "jellyfin", probe: "jellyfin",  icon: "play",   hue: "#a78bfa" },
    { name: "Immich",       purpose: "Photo and video library",          sub: "immich",   probe: "immich",    icon: "photos", hue: "#f472b6" },
    { name: "Nextcloud",    purpose: "Files, sync and sharing",          sub: "cloud",    probe: "cloud",     icon: "cloud",  hue: "#38bdf8" },
    // LAN_IP from /srv/ai-node/.env — update if the host IP changes.
    { name: "Speedtest",    purpose: "Daily Internet speed history",     url: "http://192.168.1.68:8765", probe: "speedtest", icon: "gauge", hue: "#fbbf24" }
  ]},
  { title: "AI & Compute", services: [
    { name: "Ollama",       purpose: "LLM inference API",                probe: "ollama",     icon: "cpu",  hue: "#4ade80" },
    { name: "Embeddings",   purpose: "OpenAI-compatible embeddings API", probe: "embeddings", icon: "box",  hue: "#2dd4bf" },
    { name: "GPU Scheduler", purpose: "GPU lease arbiter — internal, see Grafana", sub: "grafana", icon: "pulse", hue: "#94a3b8" }
  ]},
  { title: "Monitoring", services: [
    { name: "Grafana",      purpose: "Metrics dashboards",               sub: "grafana", probe: "grafana", icon: "chart", hue: "#fb923c" },
    { name: "Uptime Kuma",  purpose: "Uptime monitoring and status pages", sub: "kuma",  probe: "kuma",    icon: "pulse", hue: "#34d399" },
    { name: "Prometheus",   purpose: "Metrics and alert evaluation",     sub: "prom",    probe: "prom",    icon: "flame", hue: "#f87171" },
    { name: "ntfy",         purpose: "Alert notifications to your phone", sub: "ntfy",   probe: "ntfy",    icon: "bell",  hue: "#818cf8" }
  ]},
  { title: "Infrastructure", services: [
    { name: "Authelia SSO", purpose: "Sign-on portal (auth bypassed by default)", sub: "auth", probe: "auth", icon: "shield", hue: "#e879f9" },
    { name: "LLDAP",        purpose: "User directory backing SSO",       sub: "lldap",   probe: "lldap",   icon: "users",  hue: "#facc15" },
    { name: "Agent Gateway", purpose: "Scoped tool API for agent jobs",  sub: "gateway", probe: "gateway", icon: "zap",    hue: "#22d3ee" }
  ]}
];

const groupsEl = document.getElementById("groups");
const overallEl = document.getElementById("overall");
const overallText = document.getElementById("overall-text");
const refreshedEl = document.getElementById("refreshed");
const tiles = []; // { svc, statusEl, dotEl }

function build() {
  for (const group of GROUPS) {
    const section = document.createElement("section");
    section.className = "group";
    const h = document.createElement("h2");
    h.textContent = group.title;
    section.appendChild(h);
    const grid = document.createElement("div");
    grid.className = "grid";

    for (const svc of group.services) {
      const href = svc.url || (svc.sub ? `https://${svc.sub}.${BASE}` : null);
      const tile = document.createElement(href ? "a" : "div");
      tile.className = "tile";
      tile.style.setProperty("--hue", svc.hue);
      if (href) { tile.href = href; tile.target = "_blank"; tile.rel = "noopener"; }

      const head = document.createElement("div");
      head.className = "head";
      const chip = document.createElement("div");
      chip.className = "chip";
      chip.innerHTML = icon(svc.icon);
      const nameWrap = document.createElement("div");
      const name = document.createElement("div");
      name.className = "name";
      name.textContent = svc.name;
      const status = document.createElement("div");
      status.className = "status";
      const dot = document.createElement("span");
      dot.className = "dot checking";
      const statusText = document.createElement("span");
      statusText.textContent = svc.probe ? "Checking…" : "internal";
      status.appendChild(dot);
      status.appendChild(statusText);
      nameWrap.appendChild(name);
      nameWrap.appendChild(status);
      head.appendChild(chip);
      head.appendChild(nameWrap);

      const purpose = document.createElement("p");
      purpose.className = "purpose";
      purpose.textContent = svc.purpose;

      tile.appendChild(head);
      tile.appendChild(purpose);
      if (href) {
        const open = document.createElement("span");
        open.className = "open";
        open.innerHTML = icon("arrow");
        tile.appendChild(open);
      }
      grid.appendChild(tile);

      if (svc.probe) tiles.push({ svc, status, dot, statusText });
      else dot.style.display = "none";
    }
    section.appendChild(grid);
    groupsEl.appendChild(section);
  }
}

async function probeOne(t) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 6000);
  const start = performance.now();
  try {
    const res = await fetch(`/healthz/${t.svc.probe}`, { cache: "no-store", signal: controller.signal });
    const ms = Math.round(performance.now() - start);
    // Any answered response below 400 means the service is alive — several
    // apps answer their root with a 302 to a login/dashboard page. A 4xx means
    // the probe key fell through to Caddy's file_server (no route), i.e. down.
    if (res.status >= 200 && res.status < 400) {
      setState(t, "up", `Operational · ${ms} ms`);
      return true;
    }
    setState(t, "down", `HTTP ${res.status}`);
    return false;
  } catch {
    setState(t, "down", "Unreachable");
    return false;
  } finally {
    clearTimeout(timer);
  }
}

function setState(t, state, text) {
  t.dot.className = `dot ${state}`;
  t.status.className = `status ${state}`;
  t.statusText.textContent = text;
}

let refreshing = false; // guards against overlapping interval/visibilitychange refreshes
async function refresh() {
  if (refreshing) return;
  refreshing = true;
  try {
    overallEl.className = "pill";
    overallText.textContent = "Checking services…";
    overallEl.querySelector(".dot").className = "dot checking";
    for (const t of tiles) setState(t, "checking", "Checking…");

    const results = await Promise.all(tiles.map(probeOne));
    const upCount = results.filter(Boolean).length;
    const dotEl = overallEl.querySelector(".dot");
    if (upCount === tiles.length) {
      overallEl.className = "pill ok";
      dotEl.className = "dot";
      overallText.textContent = "All systems operational";
    } else {
      overallEl.className = "pill bad";
      dotEl.className = "dot";
      overallText.textContent = `${upCount} of ${tiles.length} services up`;
    }
    refreshedEl.textContent = `Updated ${new Date().toLocaleTimeString()} · refreshes every 30 s`;
  } finally {
    refreshing = false;
  }
}

build();
refresh();
setInterval(refresh, 30000);
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refresh();
});
</script>
</body>
</html>
