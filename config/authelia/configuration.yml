# Authelia SSO portal configuration.
#
# Mounted read-only at /config/configuration.yml in the authelia container;
# persistent state (SQLite database, notification file) lives in the
# /srv/ai-node/data/authelia volume, also mounted at /config.
#
# IMPORTANT: Authelia does not expand Compose variables in this file. Every
# `homeserve.lan` below is literal and must stay in sync with BASE_DOMAIN in
# /srv/ai-node/.env (and with config/caddy/Caddyfile). If you change
# BASE_DOMAIN, update this file and recreate the authelia container.
#
# Secret values are NOT stored here. They are injected from Docker secrets via
# _FILE environment variables in compose/ai-node.yml:
#   AUTHELIA_SESSION_SECRET_FILE                          (session.secret)
#   AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE                  (storage.encryption_key)
#   AUTHELIA_AUTHENTICATION_BACKEND_LDAP_PASSWORD_FILE    (ldap bind password)
#   AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE  (reset JWT secret)
# All four are generated by scripts/bootstrap-secrets.sh.

theme: dark

server:
  address: tcp://0.0.0.0:9091

log:
  level: info

authentication_backend:
  ldap:
    # The lldap implementation preset supplies the standard attribute mapping
    # (username=uid, mail=mail, group_name=cn, users under ou=people, groups
    # under ou=groups, person objectClass, member={dn} group filter), so only
    # the deployment-specific values are set here.
    implementation: lldap
    address: ldap://lldap:3890
    timeout: 5s
    start_tls: false
    # Keep in sync with LLDAP_LDAP_BASE_DN in compose/ai-node.yml.
    base_dn: dc=homeserve,dc=lan
    # LLDAP's built-in admin service account. Its password is
    # LLDAP_LDAP_USER_PASS from secrets/lldap.env, delivered to Authelia as
    # the authelia_ldap_bind_password Docker secret.
    user: uid=admin,ou=people,dc=homeserve,dc=lan

access_control:
  default_policy: deny
  rules:
    # The portal itself must be reachable while logged out.
    - domain: auth.homeserve.lan
      policy: bypass
    # Everything else on the base domain and its subdomains requires a login.
    # one_factor keeps home UX simple; to require TOTP as a second factor,
    # change both policies below to two_factor (users enrol a TOTP device from
    # the Authelia portal after their first password login).
    - domain: homeserve.lan
      policy: one_factor
    - domain: "*.homeserve.lan"
      policy: one_factor
    # To lock the LLDAP admin UI down to LLDAP's admin group, insert a more
    # specific rule BEFORE the wildcard above:
    #   - domain: lldap.homeserve.lan
    #     policy: one_factor
    #     subject: ["group:lldap_admin"]

session:
  cookies:
    # One cookie scoped to the whole base domain gives single sign-on across
    # every subdomain.
    - domain: homeserve.lan
      authelia_url: https://auth.homeserve.lan

storage:
  # encryption_key comes from AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE.
  local:
    path: /config/db.sqlite3

notifier:
  # Writes "emails" (password-reset and TOTP-enrolment links) to a file inside
  # the data volume instead of sending real mail. Retrieve them with:
  #   sudo cat /srv/ai-node/data/authelia/notification.txt
  # To switch to real mail, replace this block with an smtp: notifier, e.g.:
  #   smtp:
  #     address: smtp://smtp.example.com:587
  #     username: your-smtp-user
  #     # password via AUTHELIA_NOTIFIER_SMTP_PASSWORD_FILE
  #     sender: authelia@homeserve.lan
  filesystem:
    filename: /config/notification.txt

# identity_providers (OIDC) is intentionally not configured: Caddy
# forward_auth covers every browser-facing UI in this stack. Add an
# `identity_providers: oidc:` block here only if a future service needs
# native OIDC.

# identity_validation.reset_password needs no YAML block here: Authelia 4.39
# requires its jwt_secret at startup, which is injected via
# AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE (see compose).
# With the filesystem notifier, reset links land in
# /srv/ai-node/data/authelia/notification.txt; the admin can also reset
# passwords directly in the LLDAP UI.
